<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Gents Dollhouse | Flagship Toy, Model, Brick & Mystery Capsule Emporium</title>
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f1419;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Google Sans',sans-serif;">
        <div style="width:68px;height:68px;background:#e60012;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(230,0,18,0.45);margin-bottom:1rem;">
          <span style="font-size:0.75rem;font-weight:900;letter-spacing:0.04em;line-height:1;">GENTS</span>
          <span style="font-size:0.95rem;font-weight:900;margin-top:2px;line-height:1;">TOYS</span>
        </div>
        <div style="font-size:1.15rem;font-weight:700;letter-spacing:-0.02em;">The Gents Dollhouse</div>
        <div style="font-size:0.8rem;color:#94a3b8;margin-top:0.35rem;">Runda Mall • 3rd Floor Flagship</div>
        <div style="width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top:3px solid #e60012;border-radius:50%;animation:spin 0.8s linear infinite;margin-top:1.5rem;"></div>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
