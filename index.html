<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Gents Dollhouse | Flagship Toy, Model, Brick & Mystery Capsule Emporium</title>
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070a10;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Google Sans',sans-serif;overflow:hidden;">
        <!-- Background Image with Opacity -->
        <div style="position:absolute;inset:0;background-image:url('https://i.pinimg.com/736x/4d/07/bd/4d07bd637b424da4a24e4b580367ec18.jpg');background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0.45;pointer-events:none;transform:scale(1.03);"></div>
        <!-- Scrim Vignette Overlay -->
        <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 40%, rgba(10,14,22,0.35) 0%, rgba(5,7,12,0.85) 100%);pointer-events:none;"></div>

        <!-- Foreground Content -->
        <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <div style="width:68px;height:68px;background:#e60012;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(230,0,18,0.5);margin-bottom:1rem;border:1px solid rgba(255,255,255,0.2);">
            <span style="font-size:0.75rem;font-weight:900;letter-spacing:0.04em;line-height:1;">GENTS</span>
            <span style="font-size:0.95rem;font-weight:900;margin-top:2px;line-height:1;">TOYS</span>
          </div>
          <div style="font-size:1.2rem;font-weight:800;letter-spacing:-0.02em;">The Gents Dollhouse</div>
          <div style="font-size:0.8rem;color:#cbd5e1;margin-top:0.35rem;display:flex;align-items:center;gap:0.35rem;">
            <span style="width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;box-shadow:0 0 8px #22c55e;"></span>
            Runda Mall • 3rd Floor Flagship
          </div>
          <div style="width:40px;height:40px;border:3px solid rgba(255,255,255,0.15);border-top:3px solid #e60012;border-radius:50%;animation:spin 0.8s linear infinite;margin-top:1.5rem;"></div>
        </div>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
